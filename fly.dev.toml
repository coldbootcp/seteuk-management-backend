# dev 환경 배포 설정. fly.toml(운영)과 앱·리전 설정만 다르고 나머지는 같다.
# 배포: flyctl deploy --config fly.dev.toml --app seteuk-backend-dev
app = "seteuk-backend-dev"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# 기본값 256MB는 부팅 중(마이그레이션 + uvicorn 기동)에 OOM으로 죽는다 — 운영과
# 같은 크기로 맞춰 둔다.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[env]
  PORT = "8000"
  ENVIRONMENT = "staging"
  LOG_JSON = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health/ready"
