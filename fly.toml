# Fly.io 배포 설정. Railway를 쓸 경우 이 파일 대신 Dockerfile만으로 동작하며,
# 시작 명령은 Dockerfile의 scripts/start.sh가 그대로 쓰인다.
app = "seteuk-backend"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

# 기본값 256MB는 부팅 중(마이그레이션 + uvicorn 기동)에 OOM으로 죽는다 —
# 첫 배포에서 실제로 겪은 문제라 명시해 둔다.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  LOG_JSON = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  # 진단·파싱 job이 같은 프로세스에서 도는 동안 머신이 멈추면 안 된다.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health/ready"
